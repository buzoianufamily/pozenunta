<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Verighete">
  <!-- Fundal în verdele mărcii, colțuri rotunjite -->
  <rect width="64" height="64" rx="14" fill="#0D3328"/>
  <!-- Verigheta din spate -->
  <circle cx="25" cy="38" r="15" fill="none" stroke="#D9B876" stroke-width="5.2"/>
  <!-- Verigheta din față: întâi un contur în culoarea fundalului, ca să
       pară că trece peste cealaltă, apoi conturul auriu. -->
  <circle cx="39" cy="26" r="15" fill="none" stroke="#0D3328" stroke-width="10"/>
  <circle cx="39" cy="26" r="15" fill="none" stroke="#D9B876" stroke-width="5.2"/>
</svg>
